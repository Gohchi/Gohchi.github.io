<?xml version="1.0" encoding="utf-8"?>
<svg width="800px" height="800px" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .kana {
        fill: #000000;
        font-family: "Yu Gothic UI", "Meiryo", "Noto Sans CJK JP", "Segoe UI", sans-serif;
        font-size: 24px;
        font-weight: 500;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- katakana version of the same four-sound visual: ア, カ, ザ, セ -->
  <text class="kana" x="12" y="21">ア</text>
  <text class="kana" x="34" y="21">カ</text>
  <text class="kana" x="12" y="44">ザ</text>
  <text class="kana" x="34" y="44">セ</text>
</svg>
